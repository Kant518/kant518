name: Update profile stats card

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out the stats branch (or start it)
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin stats; then
            git clone --branch stats --single-branch "$REMOTE" out
          else
            git init -b stats out
            git -C out remote add origin "$REMOTE"
          fi

      - name: Build profile-stats.svg and contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-stats.mjs out
          node scripts/build-contrib.mjs out

      - name: Push to the stats branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update profile stats" || exit 0
          git push origin stats
