    <line x1="260" y1="140" x2="460" y2="140" stroke="#1E293B" stroke-width="1"/>
    <path class="area" d="M260.0 140.0 L310.0 74.0 L360.0 68.0 L410.0 68.0 L460.0 56.0 L460.0 140 L260 140 Z" fill="url(#fade)"/>
