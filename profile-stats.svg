<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Profile views: 42. Followers: 4.">
  <title>Profile views: 42. Followers: 4.</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E9FBF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0E9FBF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .label { font: 600 13px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.6px; fill: #94A3B8; }
    .value { font: 700 52px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; }
    .note  { font: 400 14px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #94A3B8; }
    .axis  { font: 400 12px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #64748B; }

    .tile  { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .tile + .tile { animation-delay: .15s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

    /* number counts up from 0, holds, then replays every 8s */
    .n { opacity: 0; animation-duration: 8s; animation-timing-function: step-end; animation-iteration-count: infinite; }
    @keyframes f0 { 0% { opacity: 1 }  0.83% { opacity: 0 } }
    @keyframes f1 { 0% { opacity: 0 } 0.83% { opacity: 1 } 1.67% { opacity: 0 } }
    @keyframes f2 { 0% { opacity: 0 } 1.67% { opacity: 1 } 2.50% { opacity: 0 } }
    @keyframes f3 { 0% { opacity: 0 } 2.50% { opacity: 1 } 3.33% { opacity: 0 } }
    @keyframes f4 { 0% { opacity: 0 } 3.33% { opacity: 1 } 4.17% { opacity: 0 } }
    @keyframes f5 { 0% { opacity: 0 } 4.17% { opacity: 1 } 5.00% { opacity: 0 } }
    @keyframes f6 { 0% { opacity: 0 } 5.00% { opacity: 1 } 5.83% { opacity: 0 } }
    @keyframes f7 { 0% { opacity: 0 } 5.83% { opacity: 1 } 6.67% { opacity: 0 } }
    @keyframes f8 { 0% { opacity: 0 } 6.67% { opacity: 1 } 7.50% { opacity: 0 } }
    @keyframes f9 { 0% { opacity: 0 } 7.50% { opacity: 1 } 8.33% { opacity: 0 } }
    @keyframes f10 { 0% { opacity: 0 } 8.33% { opacity: 1 } 9.17% { opacity: 0 } }
    @keyframes f11 { 0% { opacity: 0 } 9.17% { opacity: 1 } 10.00% { opacity: 0 } }
    @keyframes f12 { 0% { opacity: 0 } 10.00% { opacity: 1 } 10.83% { opacity: 0 } }
    @keyframes f13 { 0% { opacity: 0 } 10.83% { opacity: 1 } 11.67% { opacity: 0 } }
    @keyframes f14 { 0% { opacity: 0 } 11.67% { opacity: 1 } 12.50% { opacity: 0 } }
    @keyframes f15 { 0% { opacity: 0 } 12.50% { opacity: 1 } 13.33% { opacity: 0 } }
    @keyframes f16 { 0% { opacity: 0 } 13.33% { opacity: 1 } 14.17% { opacity: 0 } }
    @keyframes f17 { 0% { opacity: 0 } 14.17% { opacity: 1 } 15.00% { opacity: 0 } }
    @keyframes f18 { 0% { opacity: 0 } 15.00% { opacity: 1 } 15.83% { opacity: 0 } }
    @keyframes f19 { 0% { opacity: 0 } 15.83% { opacity: 1 } 16.67% { opacity: 0 } }
    @keyframes f20 { 0% { opacity: 0 } 16.67% { opacity: 1 } 17.50% { opacity: 0 } }
    @keyframes f21 { 0% { opacity: 0 } 17.50% { opacity: 1 } 18.33% { opacity: 0 } }
    @keyframes f22 { 0% { opacity: 0 } 18.33% { opacity: 1 } 19.17% { opacity: 0 } }
    @keyframes f23 { 0% { opacity: 0 } 19.17% { opacity: 1 } 20.00% { opacity: 0 } }
    @keyframes f24 { 0% { opacity: 0 } 20.00% { opacity: 1 }  }

    /* trend line draws in alongside the count, holds, fades, replays */
    .line    { stroke-dasharray: 1; animation: draw 8s infinite; }
    .area    { animation: area 8s ease infinite; }
    .dot     { animation: dot 8s ease infinite; }
    .pulse   { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    .pending { animation: flow 1.2s linear infinite; }
    @keyframes draw  { 0% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1) }
                       20.0% { stroke-dashoffset: 0; opacity: 1 }
                       94% { opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes area  { 0%, 10% { opacity: 0 } 28%, 94% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes dot   { 0%, 18% { opacity: 0 } 22%, 94% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes pulse { from { opacity: .6; transform: scale(1) } to { opacity: 0; transform: scale(3.5) } }
    @keyframes flow  { to { stroke-dashoffset: -10 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .final { opacity: 1; } .pulse { display: none; }
    }
  </style>

  <rect x=".5" y=".5" width="999" height="199" rx="14" fill="#0B1220" stroke="#1E293B"/>
  <line x1="500" y1="36" x2="500" y2="164" stroke="#1E293B"/>
  
  <g class="tile">
